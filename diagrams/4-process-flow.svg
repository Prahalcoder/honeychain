<text x="1307.52" y="768" font-size="17" font-weight="600" fill="#f5a524" text-anchor="middle" >Public record</text>
<rect x="1392.4" y="745" width="140" height="34" rx="17" fill="#ffffff" stroke="#f5a524" stroke-width="1.6"/>
