<text x="112" y="60" font-size="40" font-weight="700" fill="#ffffff" text-anchor="start" >Users, Roles and Jurisdiction</text>
<text x="112" y="88" font-size="20" font-weight="400" fill="#b9dcd8" text-anchor="start" >Each person sees only their own area; the ledger records who did what</text>
<text x="1864" y="62" font-size="28" font-weight="700" fill="#f5a524" text-anchor="end" >Honey Chain</text>
<text x="1864" y="88" font-size="17" font-weight="400" fill="#b9dcd8" text-anchor="end" >SIH 2026 · Problem 26021 · KVIC / MSME</text>
