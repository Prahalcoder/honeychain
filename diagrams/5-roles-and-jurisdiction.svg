<text x="104" y="292" font-size="21" font-weight="400" fill="#1f3b3f" text-anchor="start" >Verify lab results (password + signature)</text>
<circle cx="92" cy="316" r="3.5" fill="#2563eb"/>
<text x="104" y="322" font-size="21" font-weight="400" fill="#1f3b3f" text-anchor="start" >Schedule inspections and grade them</text>
