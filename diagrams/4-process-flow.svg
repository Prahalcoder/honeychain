<text x="100" y="742" font-size="26" font-weight="700" fill="#0a3d43" text-anchor="start" >10  Consumer verification</text>
<text x="100" y="776" font-size="18" font-weight="400" fill="#1f3b3f" text-anchor="start" >Scan the QR on the jar on the public website: the batch, harvest, lab certificate, officer signature, jar Merkle proof and the</text>
<text x="100" y="802" font-size="18" font-weight="400" fill="#1f3b3f" text-anchor="start" >on-chain transaction are shown. Anyone can check that the honey is genuine without an account.</text>
<text x="100" y="832" font-size="17" font-weight="600" fill="#0f766e" text-anchor="start" >Nothing about the seller&#x27;s finances or buyers is shown.</text>
