<text x="100" y="958" font-size="18" font-weight="700" fill="#0f766e" text-anchor="start" >Inspections</text>
<text x="100" y="986" font-size="15" font-weight="400" fill="#475569" text-anchor="start" >Officer schedules a visit, files a</text>
<text x="100" y="1008" font-size="15" font-weight="400" fill="#475569" text-anchor="start" >graded report</text>
<text x="450" y="958" font-size="18" font-weight="700" fill="#0f766e" text-anchor="start" >Closure</text>
<text x="450" y="986" font-size="15" font-weight="400" fill="#475569" text-anchor="start" >Keeper or officer starts it; a</text>
<text x="450" y="1008" font-size="15" font-weight="400" fill="#475569" text-anchor="start" >checklist ends it</text>
<text x="800" y="958" font-size="18" font-weight="700" fill="#0f766e" text-anchor="start" >Notices and tickets</text>
<text x="800" y="986" font-size="15" font-weight="400" fill="#475569" text-anchor="start" >Announcements down the hierarchy,</text>
<text x="800" y="1008" font-size="15" font-weight="400" fill="#475569" text-anchor="start" >help desk</text>
<text x="1150" y="958" font-size="18" font-weight="700" fill="#0f766e" text-anchor="start" >Audit</text>
<text x="1150" y="986" font-size="15" font-weight="400" fill="#475569" text-anchor="start" >Every officer action recorded and</text>
<text x="1150" y="1008" font-size="15" font-weight="400" fill="#475569" text-anchor="start" >chain-anchored</text>
<text x="1500" y="958" font-size="18" font-weight="700" fill="#0f766e" text-anchor="start" >Reports</text>
<text x="1500" y="986" font-size="15" font-weight="400" fill="#475569" text-anchor="start" >Monthly figures per region and</text>
<text x="1500" y="1008" font-size="15" font-weight="400" fill="#475569" text-anchor="start" >state</text>
