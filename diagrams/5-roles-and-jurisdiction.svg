<text x="960.0" y="172" font-size="22" font-weight="700" fill="#fff" text-anchor="middle" >KVIC Head (central office)</text>
<text x="1214" y="171" font-size="15" font-weight="600" fill="#d9f2ee" text-anchor="end" >1 office</text>
<text x="960.0" y="218" font-size="17" font-weight="400" fill="#1f3b3f" text-anchor="middle" >Sees every state and region</text>
<text x="960.0" y="243" font-size="17" font-weight="400" fill="#1f3b3f" text-anchor="middle" >Approves, inspects, closes, resets</text>
<text x="960.0" y="268" font-size="17" font-weight="400" fill="#1f3b3f" text-anchor="middle" >passwords, sends national notices</text>
