<text x="200" y="856" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" >retries failed chain jobs,</text>
<text x="200" y="878" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" >waits for dependencies,</text>
<text x="200" y="900" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" >resets nonces after restart</text>
