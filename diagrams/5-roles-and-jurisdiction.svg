<rect x="690" y="350" width="540" height="46" rx="16" fill="#2563eb"/><rect x="690" y="376" width="540" height="20" fill="#2563eb"/>
<text x="960.0" y="382" font-size="22" font-weight="700" fill="#fff" text-anchor="middle" >State officer</text>
<text x="1214" y="381" font-size="15" font-weight="600" fill="#d9f2ee" text-anchor="end" >8 offices</text>
<text x="960.0" y="428" font-size="17" font-weight="400" fill="#1f3b3f" text-anchor="middle" >One state, all its regions</text>
<text x="960.0" y="453" font-size="17" font-weight="400" fill="#1f3b3f" text-anchor="middle" >Reviews, inspects, closes,</text>
<text x="960.0" y="478" font-size="17" font-weight="400" fill="#1f3b3f" text-anchor="middle" >sends state notices</text>
<rect x="690" y="560" width="540" height="150" rx="16" fill="#fff" stroke="#0f766e" stroke-width="2.5" filter="url(#sh)"/>
<rect x="690" y="560" width="540" height="46" rx="16" fill="#0f766e"/><rect x="690" y="586" width="540" height="20" fill="#0f766e"/>
<text x="960.0" y="592" font-size="22" font-weight="700" fill="#fff" text-anchor="middle" >Regional officer</text>
<text x="1214" y="591" font-size="15" font-weight="600" fill="#d9f2ee" text-anchor="end" >22 offices</text>
<text x="960.0" y="638" font-size="17" font-weight="400" fill="#1f3b3f" text-anchor="middle" >One region of one state</text>
<text x="960.0" y="663" font-size="17" font-weight="400" fill="#1f3b3f" text-anchor="middle" >Approves keepers, verifies lab</text>
<text x="960.0" y="688" font-size="17" font-weight="400" fill="#1f3b3f" text-anchor="middle" >certificates (signed), inspects</text>
