<rect x="690" y="770" width="540" height="46" rx="16" fill="#f5a524"/><rect x="690" y="796" width="540" height="20" fill="#f5a524"/>
<text x="960.0" y="802" font-size="22" font-weight="700" fill="#0a3d43" text-anchor="middle" >Beekeeper (company)</text>
<text x="960.0" y="848" font-size="17" font-weight="400" fill="#1f3b3f" text-anchor="middle" >Own hives, harvests, lab, packaging</text>
<text x="960.0" y="873" font-size="17" font-weight="400" fill="#1f3b3f" text-anchor="middle" >Loose sales, invoices, finance</text>
<text x="960.0" y="898" font-size="17" font-weight="400" fill="#1f3b3f" text-anchor="middle" >Sellers nearby: products and orders</text>
<text x="960.0" y="923" font-size="17" font-weight="400" fill="#1f3b3f" text-anchor="middle" >Sees only their own private schema</text>
